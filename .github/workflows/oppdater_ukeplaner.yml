name: Oppdater ukeplaner

on:
  schedule:
    # Hver time, hverdager 05:00-15:00 UTC (ca. 06:00-16:00/17:00 norsk tid,
    # dekker begge sommer-/vintertid greit nok for dette formålet)
    - cron: "0 5-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3

      - name: Hent nyeste ukeplan-lenker
        run: uv run scripts/oppdater_ukeplaner.py

      - name: Commit og push hvis endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ukeplaner.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i ukeplaner.json"
          else
            git commit -m "chore: oppdater ukeplaner.json"
            git push
          fi
