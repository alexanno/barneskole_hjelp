name: Oppdater ukeplaner

on:
  schedule:
    # Hver søndag kl. 11:00 UTC = kl. 13:00 norsk sommertid (CEST, UTC+2).
    # Ukeplanen blir tilgjengelig på minskole.no fra søndag, så det holder
    # å sjekke én gang i uka. NB: i vintertid (CET, UTC+1, fra slutten av
    # oktober) blir dette kl. 12:00 norsk tid i stedet for 13:00.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3

      - name: Hent nyeste ukeplan-lenker
        run: uv run scripts/oppdater_ukeplaner.py

      - name: Commit og push hvis endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ukeplaner.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i ukeplaner.json"
          else
            git commit -m "chore: oppdater ukeplaner.json"
            git push
          fi
